<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030509"/><stop offset=".55" stop-color="#0a0f16"/><stop offset="1" stop-color="#010203"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#18222d" stroke-width="1"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="500" rx="24" fill="url(#bg)"/>
<rect width="1200" height="500" rx="24" fill="url(#grid)" opacity=".6"/>

<!-- animated scan -->
<rect x="0" y="-20" width="1200" height="3" fill="#00ff9c" opacity=".7" filter="url(#glow)">
  <animate attributeName="y" values="-20;520" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- terminal -->
<rect x="65" y="45" width="1070" height="410" rx="18" fill="#06090e" stroke="#263541" stroke-width="2"/>
<circle cx="98" cy="77" r="7" fill="#ff5f56"/><circle cx="122" cy="77" r="7" fill="#ffbd2e"/><circle cx="146" cy="77" r="7" fill="#27c93f"/>
<text x="180" y="83" fill="#6f7d8c" font-family="monospace" font-size="15">nasir@devops:~</text>

<text x="110" y="135" fill="#00ff9c" font-family="monospace" font-size="21">$ whoami</text>
<text x="110" y="177" fill="#f2f6fa" font-family="monospace" font-size="39" font-weight="700">NASIR MEHMOOD</text>

<text x="110" y="215" fill="#00ff9c" font-family="monospace" font-size="20">$ role</text>
<text x="230" y="215" fill="#d7dee7" font-family="monospace" font-size="20">DevOps Engineer | Cloud Infrastructure &amp; Automation</text>

<text x="110" y="255" fill="#00ff9c" font-family="monospace" font-size="20">$ stack</text>
<text x="230" y="255" fill="#9ba8b5" font-family="monospace" font-size="19">AWS • Docker • Kubernetes • Jenkins • Ansible</text>
<text x="230" y="282" fill="#9ba8b5" font-family="monospace" font-size="19">Terraform • Helm • Argo CD • GitOps • Linux</text>

<text x="110" y="322" fill="#00ff9c" font-family="monospace" font-size="20">$ focus</text>
<text x="230" y="322" fill="#9ba8b5" font-family="monospace" font-size="19">Automate → Containerize → Deploy → Improve</text>

<text x="110" y="365" fill="#00ff9c" font-family="monospace" font-size="20">$ status</text>
<text x="230" y="365" fill="#00ff9c" font-family="monospace" font-size="19">● BUILDING CLOUD &amp; CI/CD WORKFLOWS</text>

<text x="110" y="415" fill="#00ff9c" font-family="monospace" font-size="20">$ _</text>
<rect x="145" y="398" width="11" height="23" fill="#00ff9c">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
</svg>
