<svg width="1200" height="610" viewBox="0 0 1200 610" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030509"/>
    <stop offset=".55" stop-color="#0a0f16"/>
    <stop offset="1" stop-color="#020304"/>
  </linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M38 0H0V38" fill="none" stroke="#18232d" stroke-width="1"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="610" rx="24" fill="url(#bg)"/>
<rect width="1200" height="610" rx="24" fill="url(#grid)" opacity=".48"/>

<!-- animated scan -->
<rect x="0" y="-10" width="1200" height="3" fill="#00ff9c" opacity=".65" filter="url(#glow)">
  <animate attributeName="y" values="-10;620" dur="4.5s" repeatCount="indefinite"/>
</rect>

<!-- terminal -->
<rect x="45" y="30" width="1110" height="550" rx="18" fill="#06090e" stroke="#263541" stroke-width="2"/>
<circle cx="76" cy="58" r="7" fill="#ff5f56"/>
<circle cx="99" cy="58" r="7" fill="#ffbd2e"/>
<circle cx="122" cy="58" r="7" fill="#27c93f"/>
<text x="155" y="64" fill="#71808e" font-family="monospace" font-size="14">nasir@devops:~/skills</text>

<text x="78" y="105" fill="#00ff9c" font-family="monospace" font-size="20">$ ls ./tech-stack</text>

<!-- category boxes -->
<g fill="#080d13" stroke="#263642" stroke-width="1.5">
<rect x="78" y="130" width="1044" height="78" rx="12"/>
<rect x="78" y="225" width="1044" height="78" rx="12"/>
<rect x="78" y="320" width="1044" height="78" rx="12"/>
<rect x="78" y="415" width="1044" height="78" rx="12"/>
<rect x="78" y="510" width="1044" height="52" rx="12"/>
</g>

<!-- category labels -->
<g font-family="monospace">
<text x="100" y="158" fill="#00ff9c" font-size="17">CLOUD &amp; INFRASTRUCTURE</text>
<text x="100" y="188" fill="#d6dee6" font-size="15">AWS EC2 • S3 • IAM • ECR • EKS • CloudWatch • Linux</text>

<text x="100" y="253" fill="#00ff9c" font-size="17">CONTAINERS &amp; ORCHESTRATION</text>
<text x="100" y="283" fill="#d6dee6" font-size="15">Docker • Docker Compose • Kubernetes • KIND</text>

<text x="100" y="348" fill="#00ff9c" font-size="17">CI/CD &amp; AUTOMATION</text>
<text x="100" y="378" fill="#d6dee6" font-size="15">Jenkins • GitHub Actions • Ansible • Terraform</text>

<text x="100" y="443" fill="#00ff9c" font-size="17">GITOPS</text>
<text x="100" y="473" fill="#d6dee6" font-size="15">Helm • Argo CD • Git • GitHub</text>

<text x="100" y="543" fill="#00ff9c" font-size="17">SCRIPTING &amp; DATA</text>
<text x="340" y="543" fill="#d6dee6" font-size="15">Python • Shell Scripting • MySQL • MongoDB</text>
</g>

<!-- pulsing status -->
<circle cx="1080" cy="105" r="7" fill="#00ff9c" filter="url(#glow)">
  <animate attributeName="r" values="5;11;5" dur="1.3s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;.25;1" dur="1.3s" repeatCount="indefinite"/>
</circle>
</svg>