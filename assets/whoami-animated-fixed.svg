<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030609"/><stop offset="1" stop-color="#0b1118"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#17242d"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<rect width="1200" height="360" rx="22" fill="url(#grid)" opacity=".55"/>
<rect x="0" y="-3" width="1200" height="2" fill="#00ff9c" opacity=".55" filter="url(#glow)"><animate attributeName="y" from="-3" to="363" dur="4s" repeatCount="indefinite"/></rect>
<rect x="42" y="28" width="1116" height="304" rx="16" fill="#05090e" stroke="#263640" stroke-width="2"/>
<circle cx="72" cy="56" r="6" fill="#ff5f56"/><circle cx="94" cy="56" r="6" fill="#ffbd2e"/><circle cx="116" cy="56" r="6" fill="#27c93f"/>
<text x="145" y="61" fill="#71808c" font-family="monospace" font-size="14">nasir@devops:~/profile</text>
<text x="72" y="106" fill="#00ff9c" font-family="monospace" font-size="18">$ whoami</text>
<text x="72" y="141" fill="#f1f6f8" font-family="monospace" font-size="25" font-weight="700">DEVOPS ENGINEER</text>
<text x="72" y="177" fill="#a7b4bd" font-family="monospace" font-size="15">Entry-level DevOps Engineer focused on Linux, cloud infrastructure,</text>
<text x="72" y="201" fill="#a7b4bd" font-family="monospace" font-size="15">containers, Kubernetes and CI/CD automation.</text>
<text x="72" y="238" fill="#00ff9c" font-family="monospace" font-size="17">$ stack --core</text>
<text x="72" y="265" fill="#d0d9df" font-family="monospace" font-size="14">AWS • Docker • Kubernetes • Jenkins • Ansible • Terraform • Helm • Argo CD</text>
<text x="72" y="300" fill="#00ff9c" font-family="monospace" font-size="14">● BUILDING • AUTOMATING • LEARNING</text>
<rect x="360" y="286" width="9" height="17" fill="#00ff9c"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<circle cx="1100" cy="300" r="7" fill="#00ff9c" filter="url(#glow)"><animate attributeName="r" values="5;11;5" dur="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.25;1" dur="1.3s" repeatCount="indefinite"/></circle>
</svg>