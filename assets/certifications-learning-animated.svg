<svg width="1200" height="470" viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030509"/>
    <stop offset=".55" stop-color="#0a0f16"/>
    <stop offset="1" stop-color="#020304"/>
  </linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M38 0H0V38" fill="none" stroke="#18232d" stroke-width="1"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="470" rx="24" fill="url(#bg)"/>
<rect width="1200" height="470" rx="24" fill="url(#grid)" opacity=".48"/>

<rect x="0" y="-10" width="1200" height="3" fill="#00ff9c" opacity=".65" filter="url(#glow)">
  <animate attributeName="y" values="-10;480" dur="4s" repeatCount="indefinite"/>
</rect>

<rect x="45" y="30" width="1110" height="410" rx="18" fill="#06090e" stroke="#263541" stroke-width="2"/>
<circle cx="76" cy="58" r="7" fill="#ff5f56"/>
<circle cx="99" cy="58" r="7" fill="#ffbd2e"/>
