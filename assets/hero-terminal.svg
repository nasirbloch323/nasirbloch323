<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E0F2FE"/><stop offset=".48" stop-color="#C4B5FD"/><stop offset="1" stop-color="#FCE7F3"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".92"/><stop offset="1" stop-color="#DBEAFE" stop-opacity=".68"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C084FC"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="13"/><feOffset dy="15"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1200" height="560" rx="34" fill="url(#sky)"/>
<circle cx="1000" cy="100" r="105" fill="#FDE68A" opacity=".65" filter="url(#soft)"/>
<circle cx="190" cy="440" r="120" fill="#67E8F9" opacity=".45" filter="url(#soft)"/>
<path d="M0 420 Q250 340 480 430 T940 405 T1200 390 V560 H0Z" fill="#FFFFFF" opacity=".35"/>
<!-- floating 3D cubes -->
<g filter="url(#shadow)">
 <g transform="translate(890 145)">
  <path d="M0 45 66 7 133 45 66 84Z" fill="#DBEAFE"/><path d="M0 45 66 84V160L0 121Z" fill="#60A5FA"/><path d="M66 84 133 45V121L66 160Z" fill="#2563EB"/>
 </g>
 <g transform="translate(1020 300) scale(.58)">
  <path d="M0 45 66 7 133 45 66 84Z" fill="#F3E8FF"/><path d="M0 45 66 84V160L0 121Z" fill="#C084FC"/><path d="M66 84 133 45V121L66 160Z" fill="#7C3AED"/>
 </g>
 <g transform="translate(770 350) scale(.42)">
  <path d="M0 45 66 7 133 45 66 84Z" fill="#CFFAFE"/><path d="M0 45 66 84V160L0 121Z" fill="#22D3EE"/><path d="M66 84 133 45V121L66 160Z" fill="#0891B2"/>
 </g>
</g>
<!-- floating glass panel -->
<g filter="url(#shadow)">
 <rect x="65" y="65" width="790" height="420" rx="30" fill="url(#glass)" stroke="#FFFFFF" stroke-width="2"/>
 <rect x="65" y="65" width="790" height="12" rx="6" fill="url(#blue)" opacity=".85"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="112" y="135" fill="#64748B" font-size="18" font-weight="700" letter-spacing="4">CLOUD • AUTOMATION • DELIVERY</text>
 <text x="108" y="225" fill="#172554" font-size="62" font-weight="800">NASIR</text>
 <text x="108" y="292" fill="#172554" font-size="62" font-weight="800">MEHMOOD</text>
 <rect x="112" y="322" width="460" height="4" rx="2" fill="url(#blue)"/>
 <text x="112" y="372" fill="#334155" font-size="25" font-weight="700">DEVOPS ENGINEER</text>
 <text x="112" y="411" fill="#475569" font-size="19">AWS  ·  Kubernetes  ·  Docker  ·  CI/CD</text>
 <text x="112" y="449" fill="#64748B" font-size="16">Building reliable cloud infrastructure, one deployment at a time.</text>
 <g transform="translate(112 465)">
  <rect width="12" height="12" rx="6" fill="#10B981"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></rect>
  <text x="22" y="12" fill="#0F766E" font-size="13" font-weight="700" letter-spacing="2">BUILD • AUTOMATE • IMPROVE</text>
 </g>
</g>
<!-- orbit animation -->
<ellipse cx="980" cy="260" rx="165" ry="72" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".65" transform="rotate(-28 980 260)"/>
<circle cx="840" cy="205" r="8" fill="#FFFFFF"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="1110" cy="325" r="7" fill="#7C3AED"><animate attributeName="r" values="5;10;5" dur="2.4s" repeatCount="indefinite"/></circle>
</svg>