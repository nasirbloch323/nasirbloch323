<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#030609"/><stop offset="1" stop-color="#0b1118"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="120" rx="18" fill="url(#bg)" stroke="#263640"/>
<g font-family="monospace" font-size="22" font-weight="700" text-anchor="middle">
  <text x="150" y="68" fill="#00ff9c" opacity="0">AUTOMATE
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.25;.33" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="68" fill="#00ff9c" opacity="0">AUTOMATE
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.25;.33;.50;.58" dur="6s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="68" fill="#00ff9c" opacity="0">CONTAINERIZE
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.25;.33;.50;.58" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="750" y="68" fill="#00ff9c" opacity="0">DEPLOY
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.50;.58;.75;.83" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="1030" y="68" fill="#00ff9c" opacity="0">IMPROVE
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.75;.83;.98;1" dur="6s" repeatCount="indefinite"/>
  </text>
</g>

<g fill="#00ff9c" font-family="monospace" font-size="22" filter="url(#glow)" text-anchor="middle">
  <text x="300" y="68" opacity=".65">→</text>
  <text x="600" y="68" opacity=".65">→</text>
  <text x="890" y="68" opacity=".65">→</text>
</g>

<rect x="75" y="91" width="1050" height="2" rx="1" fill="#17352b"/>
<rect x="75" y="91" width="0" height="2" rx="1" fill="#00ff9c" filter="url(#glow)">
  <animate attributeName="width" values="0;1050" dur="6s" repeatCount="indefinite"/>
</rect>
</svg>