name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 3 * * *"  # Runs daily at 3 AM UTC
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.actor }}
          SETTING_JSON: |
            {
              "type": "rainbow",
              "fileName": "profile-customize.svg",
              "backgroundColor": "#0D1117",
              "foregroundColor": "#FFFFFF",
              "strongColor": "#00F0FF",
              "weakColor": "#1F6FEB",
              "radarColor": "#FF6B6B",
              "growingAnimation": true,
              "contribLightColors": ["#FF6B6B", "#FFD93D", "#6BCB77", "#4D96FF", "#9B59B6"],
              "contribDarkColors": ["#FF6B6B", "#FFD93D", "#6BCB77", "#4D96FF", "#9B59B6"]
            }

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "🌌 Updated 3D Contribution Graph" || exit 0
          git push
